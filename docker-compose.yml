# ============================================
# Docker Compose Configuration for Person_Web
# Optimized for 2C2G environment
# ============================================

version: '3.8'

services:
  # ============================================
  # MySQL Database Service
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: person_web_mysql
    restart: unless-stopped
    command: --ngram-token-size=2

    # Port mapping (only for local access, NOT exposed to public)
    ports:
      - "127.0.0.1:3306:3306"

    # Environment variables from file
    env_file:
      - .env.production

    # Environment variables (static values only; MYSQL_ROOT_PASSWORD/MYSQL_DATABASE come from env_file)
    environment:
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    # Resource limits (768MB for MySQL)
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0

    # Data persistence
    volumes:
      - mysql_data:/var/lib/mysql

    # Network configuration
    networks:
      - person_web_network

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Application Service
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: person_web_app
    restart: unless-stopped

    # Port mapping
    ports:
      - "3000:3000"

    # Environment variables from file
    env_file:
      - .env.production

    # Additional environment variables (DATABASE_URL comes from env_file)
    environment:
      NODE_ENV: production

    # GitHub DNS fix for China servers
    extra_hosts:
      - "github.com:20.200.245.247"

    # Resource limits (512MB for app)
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0

    # Data persistence
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups

    # Network configuration
    networks:
      - person_web_network

    # Service dependencies
    depends_on:
      mysql:
        condition: service_healthy

    # Health check (inherited from Dockerfile)
    # The HEALTHCHECK instruction in Dockerfile will be used

# ============================================
# Network Configuration
# ============================================
networks:
  person_web_network:
    driver: bridge
    name: person_web_network

# ============================================
# Volume Configuration
# ============================================
volumes:
  mysql_data:
    driver: local
    name: person_web_mysql_data
