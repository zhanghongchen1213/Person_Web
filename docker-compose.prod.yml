version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: person_web_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_blog}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - person_web_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/zhanghongchen1213/person_web:latest
    container_name: person_web_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-personal_blog}?charset=utf8mb4
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - person_web_network
    depends_on:
      mysql:
        condition: service_healthy

networks:
  person_web_network:
    driver: bridge
    name: person_web_network

volumes:
  mysql_data:
    driver: local
    name: person_web_mysql_data
